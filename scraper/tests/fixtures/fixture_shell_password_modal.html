  <div class="ant-modal" style="width:416px">
    <div class="ant-modal-content">
      <div class="ant-modal-header">
        <div class="ant-modal-title" id="rcDialogTitle0">Your Password is Expiring Soon</div>
      </div>

        Please update your password to maintain access to your account.
      </div>
      <div class="ant-modal-footer">
        <button type="button" class="ant-btn"><span>Later</span></button>
        <button type="button" class="ant-btn ant-btn-primary"><span>Change Now</span></button>

    </div>
  </div>
</div>
