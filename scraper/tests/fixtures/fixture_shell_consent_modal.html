<!-- A shell modal offering nothing on the allowlist. The automation must report
     it, not press "Acknowledge" or "Accept" on a live CRM to get past it. -->
<div tabindex="-1" role="dialog" class="ant-modal-wrap " aria-labelledby="rcDialogTitle0">
  <div class="ant-modal" style="width:416px">
    <div class="ant-modal-content">
      <div class="ant-modal-header">
        <div class="ant-modal-title" id="rcDialogTitle0">Terms of Use Updated</div>
      </div>
      <div class="ant-modal-body">You must accept the updated terms to continue.</div>
      <div class="ant-modal-footer">
        <button type="button" class="ant-btn"><span>Acknowledge</span></button>
        <button type="button" class="ant-btn ant-btn-primary"><span>Accept</span></button>
      </div>
    </div>
  </div>
</div>
